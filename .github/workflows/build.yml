name: Build CameraUtility2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore project dependencies
        run: >-
          nuget restore COM3D2.CameraUtility2.sln
          -PackagesDirectory packages
          -Source "https://api.nuget.org/v3/index.json;https://nuget.bepinex.dev/v3/index.json"
          -NonInteractive

      - name: Download .NET Framework 3.5 reference assemblies
        run: >-
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net35
          -Version 1.0.3
          -OutputDirectory packages
          -Source "https://api.nuget.org/v3/index.json"
          -NonInteractive

      - name: Configure reference assemblies for this build
        run: |
          $projectPath = (Resolve-Path "COM3D2.CameraUtility2.csproj").Path
          $targetsPath = (Resolve-Path "packages/Microsoft.NETFramework.ReferenceAssemblies.net35.1.0.3/build/Microsoft.NETFramework.ReferenceAssemblies.net35.targets").Path

          [xml]$project = Get-Content -LiteralPath $projectPath -Raw
          $import = $project.CreateElement(
            "Import",
            $project.DocumentElement.NamespaceURI
          )
          $import.SetAttribute("Project", $targetsPath)
          [void]$project.DocumentElement.AppendChild($import)
          $project.Save($projectPath)

      - name: Build Release DLL
        run: >-
          msbuild COM3D2.CameraUtility2.csproj
          /t:Rebuild
          /m
          /p:Configuration=Release
          /p:Platform=AnyCPU
          /p:PostBuildEvent=
          /verbosity:minimal
          /nologo

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v7
        with:
          name: CameraUtility2-Release
          path: bin/Release/COM3D2.CameraUtility2.Plugin.dll
          if-no-files-found: error
          retention-days: 14
