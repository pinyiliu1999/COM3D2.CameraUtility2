name: Build Plugin DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.2.2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2.0.0

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2.0.0

    - name: Download & Stub Game Dependencies
      shell: powershell
      run: |
        # 1. 确保 libs 目录存在
        if (!(Test-Path "libs")) { New-Item -ItemType Directory -Path "libs" }
        
        # 2. 从可靠公共渠道下载 Assembly-CSharp 基础存根
        Invoke-WebRequest -Uri "https://github.com" -OutFile "libs/Assembly-CSharp.dll"
        
        # 3. 如果作者的 libs 里缺少基础 UnityEngine，则从可靠源补签
        if (!(Test-Path "libs/UnityEngine.dll")) {
            Invoke-WebRequest -Uri "https://github.com" -OutFile "libs/UnityEngine.dll"
        }

    - name: Restore NuGet Packages
      run: nuget restore COM3D2.CameraUtility.csproj

    - name: Build Solution
      run: msbuild COM3D2.CameraUtility.csproj /p:Configuration=Release /p:Platform="Any CPU"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4.6.0
      with:
        name: COM3D2.CameraUtility2-DLL
        path: |
          **/bin/Release/COM3D2.CameraUtility*.dll
